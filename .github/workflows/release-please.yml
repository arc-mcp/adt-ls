name: release-please

# release-please watches conventional-commit history on main. It maintains a
# "release PR" (version bump + CHANGELOG). Merging that PR creates the git tag +
# GitHub release, which triggers the publish job below to push to npm.

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-publish of the current main version (recovery)

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance — no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # `npm ci` then `npm publish` runs prepublishOnly (lint + typecheck) and
      # prepack (tsup build) automatically — same as a local publish.
      - run: npm ci
      - run: npm publish --provenance --access public
